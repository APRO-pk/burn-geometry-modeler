[package]
name = "burn-core"
version = "0.1.0"
edition = "2021"
description = "APRO solid motor internal-ballistics core (RK4), compiled to WASM"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned: wasm-bindgen 0.2.126's build script fails to resolve its own
# `rustversion` build-dep on this toolchain. 0.2.100 / js-sys 0.3.77 is the
# matched pair known to build cleanly here.
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true

# Standalone crate: the JS project root has no Cargo.toml, so declare an empty
# workspace to stop cargo searching upward.
[workspace]
